<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Debug | JS Cheat Code Plugin</title>
		<meta name="author" content="Michael Bigelow">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="css/main.css">
	</head>
	<body>
		<div id="container">
			<div class="debug-window">
				<div class="debug-label">
					Cheat Attempt
				</div>
				<div id="cheat-attempt" class="debug-content">

				</div>
			</div>
			<div class="debug-window">
				<div class="debug-label">
					Cheat ID
				</div>
				<div id="cheat-id" class="debug-content">

				</div>
			</div>
			<div class="debug-window">
				<div class="debug-label">
					Recorded Keys
					<button id="record-button" type="button" class="record-button">Record</button>
				</div>
				<div id="recorded-keys" class="debug-content">

				</div>
			</div>
		</div>
		<script src="js/js-cheat-code-plugin.js"></script>
		<script>
			const cheatAttemptElement = document.querySelector( "#cheat-attempt" );
			const cheatIdElement      = document.querySelector( "#cheat-id" );

			jsCheats.addEventListener( "attempt", ( { detail } ) => {
				cheatAttemptElement.textContent = detail.attempt;
			} );

			jsCheats.addEventListener( "reset", ( { detail } ) => {
				cheatAttemptElement.textContent = detail.attempt;
			} );

			jsCheats.addEventListener( "success", ( { detail } ) => {
				cheatIdElement.textContent = detail.id;
			} );

			// Recording: press Record, type a sequence, press Stop to save it as a new cheat code
			const recordButton        = document.querySelector( "#record-button" );
			const recordedKeysElement = document.querySelector( "#recorded-keys" );
			let customCheatCount      = 0;

			jsCheats.addEventListener( "record", ( { detail } ) => {
				recordedKeysElement.textContent = detail.recorded;
			} );

			recordButton.addEventListener( "click", () => {
				recordButton.blur(); // Keep Space/Enter from pressing the button while recording

				if( !jsCheats.recording ){
					jsCheats.startRecording();
					recordButton.textContent        = "Stop";
					recordedKeysElement.textContent = "";
					return;
				}

				const keys = jsCheats.stopRecording();
				recordButton.textContent = "Record";

				if( keys.length === 0 ){
					recordedKeysElement.textContent = "Nothing recorded";
					return;
				}

				const id = `Custom ${++customCheatCount}`;
				jsCheats.addCheatCode( { id, code: keys } );
				recordedKeysElement.textContent = `Saved "${id}": ${keys.join( "," )}`;
			} );
		</script>
	</body>
</html>
